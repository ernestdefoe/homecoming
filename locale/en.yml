      guest_nudge_help: Off, guests see nothing from Homecoming.
      weather: Show the weather
      weather_help: "For members who set a town (or a Member Map place). The forum fetches it from Open-Meteo in the background, at most once every 30 minutes per area; only the area's rounded coordinates are sent."
